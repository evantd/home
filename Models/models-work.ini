; llama-server router-mode presets (work laptop variant)
; Launch: llama-server --models-preset ~/Models/models-work.ini (via ~/Models/llama-server-work.sh)
;
; Topology (mirrors personal laptop — see BlueBarb doc § "Local model server topology, May 2026"):
;   :18081 embeddings           (standalone llama-server)
;   :18082 llama-server router  (this file)
;
; OptiLLM was tried May 31, 2026 but pulled from default path (router_plugin
; reloads ModernBERT per request → ~10s tax). Re-enable when fixed.
;
; Work laptop is 64 GB M3 Max — much tighter than personal's 128 GB. Keep
; models-max=1 (one model resident at a time) and conservative per-model KV.
;
; Mining (Phase 1+5+10) now runs locally on this box, sharing the router
; with occasional OpenCode use. CLASSIFY_CONCURRENCY=4 was the historical
; classify batching target; parallel=4 covers it.
;
; Requires `sudo sysctl iogpu.wired_limit_mb=57344` so GPU can reserve
; ~56 GB (default cap ~48 GB on 64 GB M3 Max is too tight).
;
; Defaults applied to every model; per-section overrides take precedence.
; Router controls/overrides: host, port, api-key, hf repo, model alias —
; do NOT set those per-section, they will be stripped.
[*]
n-gpu-layers = 99
cache-type-k = q8_0
cache-type-v = q8_0
jinja = true

; Primary model: zettel mining, classification, general reasoning
; MoE (3B active) — fast generation on tight memory budget
[qwen3.6-moe]
model = /Users/edower/Models/Qwen3.6-35B-A3B-GGUF/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
mmproj = /Users/edower/Models/Qwen3.6-35B-A3B-GGUF/mmproj-F16.gguf
alias = qwen3.6-moe
; parallel=10 covers mining's 9-wide extraction burst in one wave + 1 spare
; slot for the serial phases (dedupe/classify) to interleave. ctx-size is the
; TOTAL KV budget (split across slots): 262144/10 ≈ 26K per slot, ~3x the
; largest prompt we ever send (~9.4K tokens). Cut from 1048576 (256K/slot,
; ~27x oversized) to free ~4-6 GB of KV cache on the 64 GB box. KV memory
; tracks ctx-size (total), not parallel, so higher parallel is ~free here.
parallel = 10
ctx-size = 262144
temp = 0.6
top-p = 0.95
top-k = 20

; Dense 27B — stronger coding/reasoning, slower decode. Single-slot to fit.
[qwen3.6-27b]
model = /Users/edower/Models/Qwen3.6-27B-GGUF/Qwen3.6-27B-UD-Q4_K_XL.gguf
alias = qwen3.6-27b
parallel = 1
ctx-size = 262144
temp = 0.6
top-p = 0.95
top-k = 20

; Coding agent model
[qwen3-coder-next]
model = /Users/edower/Models/Qwen3-Coder-Next-GGUF/Qwen3-Coder-Next-UD-Q3_K_XL.gguf
alias = qwen3-coder-next
parallel = 2
ctx-size = 524288
temp = 1.0
top-p = 0.95
top-k = 40
