; llama-server router-mode presets
; Launch: llama-server --models-preset ~/Models/models.ini (via ~/Models/llama-server.sh)
;
; Topology (see BlueBarb doc § "Local model server topology, May 2026"):
;   :18081 embeddings (standalone llama-server)
;   :18082 llama-server router (this file)
;   :18083 OptiLLM (approach=router) → upstream :18082
;   OpenCode default goes through :18083; bypass via :18082
;
; Plan C KV budget (q8 KV cache; ctx-size is PER-SLOT, not cumulative):
;   qwen dense/MoE: parallel=2, ctx=262144  → 2 × 262144 = ~512k total KV
;   gemma 31B/26B-MoE: parallel=1, ctx=262144 → 1 × 262144 per slot
; NOTE: qwen3.6 models have training context of 262144. Setting higher gets silently
; capped by llama.cpp (see "the slot context exceeds the training context" warning).
; Router holds up to 2 models resident (--models-max 2); LRU evicts the rest.
;
; Defaults applied to every model. Per-section overrides take precedence.
; Router controls/overrides: host, port, api-key, hf repo, model alias —
; do NOT set those per-section, they will be stripped.
[*]
n-gpu-layers = 99
cache-type-k = q8_0
cache-type-v = q8_0
jinja = true

; Primary model: dense, best accuracy (82.5% on harness-bench)
; NOTE: Runs as dedicated standalone server on port 18080 for OpenCode (always warm).
; This section is also available in the router for on-demand use by mining pipeline
; phase 10 (classify), which routes through INFERENCE_API_BASE.
; Settings per Unsloth guidance: https://unsloth.ai/docs/models/qwen3.6
; presence_penalty: 0.0-2.0, default off. Helps reduce repetitions but may slightly reduce performance.
[qwen3.6-27b]
model = /Users/evantd/Models/Qwen3.6-27B-GGUF/Qwen3.6-27B-UD-Q4_K_XL.gguf
alias = qwen3.6-27b
parallel = 2
ctx-size = 262144
temp = 0.6
top-p = 0.95
top-k = 20

; MoE (3B active): fast generation with decent accuracy (80%)
; Available on router as a fast fallback option.
; Settings per Unsloth guidance: https://unsloth.ai/docs/models/qwen3.6
[qwen3.6-moe]
model = /Users/evantd/Models/Qwen3.6-35B-A3B-GGUF/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
mmproj = /Users/evantd/Models/Qwen3.6-35B-A3B-GGUF/mmproj-F16.gguf
alias = qwen3.6-moe
parallel = 2
ctx-size = 262144
temp = 0.6
top-p = 0.95
top-k = 20

; Gemma 4 31B: strong reasoning (81.2%), dense
; Used for: analysis, planning, non-coding tasks
[gemma-4-31b]
model = /Users/evantd/Models/gemma-4-31b-it-GGUF/gemma-4-31B-it-UD-Q4_K_XL.gguf
alias = gemma-4-31b
parallel = 1
ctx-size = 262144
temp = 0.6
top-p = 0.95
top-k = 20

; Gemma 4 26B-A4B (MoE, 4B active): fast (~397s/task)
; Backup fast model for short-context tasks
[gemma-4-26b-moe]
model = /Users/evantd/Models/gemma-4-26B-A4B-it-GGUF/gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf
alias = gemma-4-26b-moe
parallel = 1
ctx-size = 262144
temp = 0.6
top-p = 0.95
top-k = 20
