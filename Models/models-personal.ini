; llama-server router-mode presets
; Launch: llama-server --models-preset ~/Models/models.ini (via ~/Models/llama-server.sh)
;
; Topology (see BlueBarb doc § "Local model server topology, May 2026"):
;   :18081 embeddings (standalone llama-server)
;   :18082 llama-server router (this file)
;   :18083 OptiLLM (approach=router) → upstream :18082
;   OpenCode default goes through :18083; bypass via :18082
;
; KV budget (q8 KV cache; --kv-unified means ctx-size is total shared pool):
;   All models: ctx=131072 (half of 262K training context)
;   NOTE: Quality degrades noticeably around 130K (model rumination, looping).
;   Setting ctx-size to 131K triggers compaction earlier, keeping quality stable.
;   Training context is 262144 — setting higher gets silently capped by llama.cpp.
;   Router holds 1 model resident (--models-max 1); LRU evicts the rest.
;
; Defaults applied to every model. Per-section overrides take precedence.
; Router controls/overrides: host, port, api-key, hf repo, model alias —
; do NOT set those per-section, they will be stripped.
;
; Naming: stable family aliases ($family-dense / $family-moe) so a minor model
; upgrade (e.g. qwen 3.8 -> 3.9) only changes the `model =` path below, never the
; alias that OpenCode / the mining pipeline reference.
[*]
n-gpu-layers = 99
cache-type-k = q8_0
cache-type-v = q8_0
jinja = true

; Qwen dense (PRIMARY): always-loaded dedicated server on :18080 for OpenCode.
; Also available here on-demand for the mining pipeline (phase 10 classify).
; MTP + vision both confirmed working together (re-tested 2026-08-19).
; MTP is left OFF on this router copy (the dedicated server runs it ON); vision ON.
; Settings per Unsloth guidance: https://unsloth.ai/docs/models/qwen3.8
[qwen-dense]
model = /Users/evantd/Models/Qwen3.8-27B-GGUF/Qwen3.8-27B-Q8_0.gguf
mmproj = /Users/evantd/Models/Qwen3.8-27B-GGUF/mmproj-F16.gguf
alias = qwen-dense
parallel = 1
ctx-size = 131072
temp = 0.6
top-p = 0.95
top-k = 20

; Qwen MoE (3B active): fast generation with decent accuracy (80%)
; Available on router as a fast fallback option. Used by zettel mining pipeline.
; Settings per Unsloth guidance: https://unsloth.ai/docs/models/qwen3.6
[qwen-moe]
model = /Users/evantd/Models/Qwen3.6-35B-A3B-MTP-GGUF/Qwen3.6-35B-A3B-Q8_0.gguf
mmproj = /Users/evantd/Models/Qwen3.6-35B-A3B-MTP-GGUF/mmproj-F16.gguf
alias = qwen-moe
parallel = 1
ctx-size = 131072
temp = 0.6
top-p = 0.95
top-k = 20
spec-type = draft-mtp
spec-draft-n-max = 4

; Gemma dense 31B: strong reasoning (81.2%)
