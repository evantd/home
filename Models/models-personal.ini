[gemma-dense]
model = /Users/evantd/Models/gemma-4-31b-it-GGUF/gemma-4-31B-it-Q8_0.gguf
mmproj = /Users/evantd/Models/gemma-4-31b-it-GGUF/mmproj-F16.gguf
model-draft = /Users/evantd/Models/gemma-4-31b-it-GGUF/MTP/gemma-4-31B-it-Q8_0-MTP.gguf
alias = gemma-dense
parallel = 1
ctx-size = 131072
temp = 0.6
top-p = 0.95
top-k = 20
spec-type = draft-mtp
spec-draft-n-max = 4

; Gemma MoE 26B-A4B (4B active): fast (~397s/task)
; Backup fast model for short-context tasks
[gemma-moe]
model = /Users/evantd/Models/gemma-4-26B-A4B-it-GGUF/gemma-4-26B-A4B-it-Q8_0.gguf
mmproj = /Users/evantd/Models/gemma-4-26B-A4B-it-GGUF/mmproj-F16.gguf
model-draft = /Users/evantd/Models/gemma-4-26B-A4B-it-GGUF/MTP/gemma-4-26B-A4B-it-Q8_0-MTP.gguf
alias = gemma-moe
parallel = 1
ctx-size = 131072
temp = 0.6
top-p = 0.95
top-k = 20
spec-type = draft-mtp
spec-draft-n-max = 4

; Nemotron MoE 3.5 Lightning (3B active): agent-optimized, built-in MTP
; Text-only model. Native 1M context but capped at 131K to avoid KV cache bloat.
; NOTE: enable_thinking must be false — llama.cpp bug causes model to never exit
; thinking mode when enabled (issues #20754, #20325). Content goes to reasoning_content.
; Settings per Unsloth guidance: https://unsloth.ai/docs/models/nemotron
[nemotron-moe]
model = /Users/evantd/Models/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q8_0.gguf
alias = nemotron-moe
parallel = 1
ctx-size = 131072
temp = 0.6
top-p = 0.95
top-k = 20
spec-type = draft-mtp
spec-draft-n-max = 4
chat-template-kwargs = {"enable_thinking": false}

; Muse Glimmer 30B: dense, multimodal, Apache 2.0
; Creative reasoning. No MTP.
[muse-dense]
model = /Users/evantd/Models/Muse-Glimmer-30B-GGUF/Muse-Glimmer-30B-Q8_0.gguf
